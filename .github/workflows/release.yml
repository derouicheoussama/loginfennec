name: Release

# Publie, à chaque tag v* : loginfennec.zip + update.json + .sha256.
# Les clients avec LOGINFENNEC_UPDATE_SERVER pointé sur
# releases/latest/download/update.json reçoivent la mise à jour
# instantanément dans leur dashboard. Après publication wp.org, ce canal
# s'efface automatiquement (priorité wp.org dans class-updater.php).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (historique complet pour le message du tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Construire le zip
        run: |
          mkdir -p build/loginfennec
          rsync -a --delete \
            --exclude '.github' \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'build' \
            --exclude 'tools' \
            --exclude 'wporg-assets' \
            --exclude 'brand' \
            --exclude 'README.md' \
            --exclude '*.pot' \
            --exclude '_*' \
            --exclude '.*' \
            --exclude 'phpcs.xml.dist' \
            --exclude 'composer.json' \
            --exclude 'composer.lock' \
            --exclude 'PRODUCTION.md' \
            --exclude 'deploy.sh' \
            --exclude 'PROMPT-VERIFICATION.md' \
            --exclude 'SECURITY.md' \
            ./ build/loginfennec/
          (cd build && zip -r loginfennec.zip loginfennec)

      - name: Vérifier la syntaxe PHP (stricte)
        run: |
          ERR=0
          while IFS= read -r -d '' f; do
            php -l "$f" || ERR=1
          done < <(find . -name '*.php' -not -path './.git/*' -not -path './build/*' -print0)
          exit $ERR

      - name: Vérifier la structure du zip (racine, slashs, fichier principal)
        run: |
          python3 - <<'PY'
          import zipfile, sys
          z = zipfile.ZipFile('build/loginfennec.zip')
          names = z.namelist()
          bad = [n for n in names if '\\' in n]
          outside = [n for n in names if not n.startswith('loginfennec/')]
          main = 'loginfennec/loginfennec.php' in names
          if bad or outside or not main:
              print('ÉCHEC structure :', {'antislash': bad, 'hors_racine': outside, 'principal': main})
              sys.exit(1)
          print(f'STRUCTURE OK ({len(names)} entrées)')
          PY

      - name: Générer update.json (canal mises à jour instantané)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SUM=$(sha256sum build/loginfennec.zip | cut -d' ' -f1)
          # Changelog réel : le message du tag annoté (tronqué à 2000 car.).
          CHANGELOG=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" 2>/dev/null | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' | head -c 2000)
          [ -z "$CHANGELOG" ] && CHANGELOG="Voir la release ${GITHUB_REF_NAME} sur GitHub."
          jq -n --arg v "$VERSION" --arg s "$SUM" --arg cl "$CHANGELOG" \
            '{name:"LoginFennec Pro",version:$v,download_url:"https://github.com/derouicheoussama/loginfennec/releases/latest/download/loginfennec.zip",checksum:$s,requires:"5.2",requires_php:"7.2",tested:"7.1",url:"https://github.com/derouicheoussama/loginfennec",last_updated:(now|todate),sections:{changelog:("<pre>"+$cl+"</pre>")}}' \
            > build/update.json
          sha256sum build/loginfennec.zip > build/loginfennec.zip.sha256

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/loginfennec.zip
            build/update.json
            build/loginfennec.zip.sha256
          generate_release_notes: true
